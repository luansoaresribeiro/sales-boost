name: Deploy functions

# Publica no Supabase só as Edge Functions afetadas por um merge no main (pedido do dono, 2026-11-11: "tá chato eu ter
# que rodar isso toda vez"). Cada função mantém o verify_jwt que já tem em produção (lido da API antes de publicar);
# função nova nasce com verify_jwt ligado (o mais seguro). Precisa do secret SUPABASE_ACCESS_TOKEN no repositório.
# Também dá para rodar à mão (Actions → Deploy functions → Run workflow) com a lista de funções.
on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Funções separadas por espaço (vazio = as afetadas pelo último commit)'
        required: false
        default: ''

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: miwcxakzyforbahpnpst
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Funções afetadas
        id: fns
        env:
          MANUAL: ${{ github.event.inputs.functions }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$MANUAL" ]; then
            FNS="$MANUAL"
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="HEAD~1"; fi
            FNS=$(git diff --name-only "$BEFORE" HEAD | python3 scripts/affected-functions.py | xargs)
          fi
          for f in $FNS; do
            if ! [[ "$f" =~ ^[a-z0-9-]+$ ]] || [ ! -f "supabase/functions/$f/index.ts" ]; then echo "Função inválida: $f"; exit 1; fi
          done
          echo "Funções: ${FNS:-(nenhuma)}"
          echo "list=$FNS" >> "$GITHUB_OUTPUT"

      - name: Supabase CLI
        if: steps.fns.outputs.list != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar
        if: steps.fns.outputs.list != ''
        env:
          FNS: ${{ steps.fns.outputs.list }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Falta o secret SUPABASE_ACCESS_TOKEN"; exit 1; fi
          for f in $FNS; do
            code=$(curl -s -o fn.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$f")
            flag=""
            if [ "$code" = "200" ] && [ "$(jq -r '.verify_jwt' fn.json)" = "false" ]; then flag="--no-verify-jwt"; fi
            echo "→ $f (verify_jwt atual: $( [ -n "$flag" ] && echo false || echo true ), resposta $code)"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api $flag
          done
