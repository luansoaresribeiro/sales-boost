name: Deploy site

# Publica o site (getsaleboost.com) depois de cada merge no main que muda a tela (pedido do dono, 2026-11-12).
# Mesmo comando que o dono rodava: npm run build && npx wrangler deploy. Precisa dos secrets CLOUDFLARE_API_TOKEN e
# CLOUDFLARE_ACCOUNT_ID. Também roda à mão (Actions → Deploy site → Run workflow).
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'wrangler.jsonc'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Publicar
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Faltam os secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"; exit 1; fi
          npx wrangler deploy
      - name: Conferir o site no ar
        run: |
          want=$(ls dist/assets | grep -E '^index-.*\.js$' | head -1)
          for i in 1 2 3 4 5 6; do
            live=$(curl -s "https://getsaleboost.com/?v=$(date +%s)" | grep -o 'index-[A-Za-z0-9_-]*\.js' | head -1)
            [ "$live" = "$want" ] && { echo "Site publicado em getsaleboost.com ✅ ($live)"; exit 0; }
            sleep 10
          done
          echo "No ar: $live — esperado: $want"; exit 1
